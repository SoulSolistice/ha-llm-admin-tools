name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python .github/scripts/core_requirements.py | pip install -r /dev/stdin
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: mypy custom_components/llm_admin_tools
      - run: pytest tests --cov=custom_components.llm_admin_tools --cov-branch --cov-fail-under=100
