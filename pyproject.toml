[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.llm_admin_tools"]
branch = true

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213", "PLR0911", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D103", "PLC0415", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
